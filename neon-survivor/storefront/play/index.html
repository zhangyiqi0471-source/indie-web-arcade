<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Void Survivor</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #060812; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 14px; left: 16px; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .stat {
      background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700;
    }
    #controls-hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: rgba(148, 163, 184, 0.8); font-size: 12px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="stat" id="score-box">WAVE 1 · SCORE 0 · LVL 1</div>
    <div class="stat" id="hp-box" style="border-color:rgba(244,63,94,0.4);color:#fda4af;">HP: 100 / 100</div>
  </div>
  <div id="controls-hint">Move: WASD / Arrow Keys / Mouse Follow · Space: Dash</div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreBox = document.getElementById("score-box");
    const hpBox = document.getElementById("hp-box");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const keys = {};
    let mouse = { x: canvas.width / 2, y: canvas.height / 2, active: false };
    window.addEventListener("keydown", (e) => { keys[e.code] = true; });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });
    window.addEventListener("pointermove", (e) => { mouse = { x: e.clientX, y: e.clientY, active: true }; });

    const player = { x: canvas.width / 2, y: canvas.height / 2, r: 13, speed: 4.1, hp: 100, maxHp: 100, xp: 0, lvl: 1, fireCd: 0 };
    let bullets = [], enemies = [], gems = [], particles = [];
    let score = 0, wave = 1, ticks = 0;

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x = 0, y = 0;
      if (side === 0) { x = Math.random() * canvas.width; y = -25; }
      else if (side === 1) { x = canvas.width + 25; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 25; }
      else { x = -25; y = Math.random() * canvas.height; }
      const hp = 1 + Math.floor(wave * 0.7);
      enemies.push({ x, y, r: 12 + (wave % 3) * 2, speed: 1.4 + wave * 0.18, hp, maxHp: hp });
    }

    function burst(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.5 + Math.random() * 3.5;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22, color });
      }
    }

    function update() {
      if (window.GamePub && window.GamePub.isPausedByPaywall && window.GamePub.isPausedByPaywall()) {
        return;
      }
      ticks++;
      if (ticks % Math.max(14, 46 - wave * 4) === 0) spawnEnemy();
      if (ticks % 900 === 0) {
        wave++;
        // Optional Boss/Wave Paywall Hook! If Wave 3 reached and still in Free Demo, trigger paywall!
        if (wave === 3 && window.GamePub && !window.GamePub.isUnlocked()) {
          window.GamePub.triggerPaywall("You conquered Waves 1–2! Unlock Wave 3 Bosses & Endless Mode:");
        }
      }

      let dx = 0, dy = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) dy -= 1;
      if (keys["KeyS"] || keys["ArrowDown"]) dy += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        const boost = keys["Space"] ? 1.85 : 1;
        player.x += (dx / len) * player.speed * boost;
        player.y += (dy / len) * player.speed * boost;
        mouse.active = false;
      } else if (mouse.active) {
        const mdx = mouse.x - player.x, mdy = mouse.y - player.y;
        const dist = Math.hypot(mdx, mdy);
        if (dist > 8) {
          player.x += (mdx / dist) * player.speed * 0.9;
          player.y += (mdy / dist) * player.speed * 0.9;
        }
      }
      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

      // Auto-fire nearest enemy
      player.fireCd--;
      if (player.fireCd <= 0 && enemies.length > 0) {
        let nearest = enemies[0], bestD = 1e9;
        for (const e of enemies) {
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < bestD) { bestD = d; nearest = e; }
        }
        const ang = Math.atan2(nearest.y - player.y, nearest.x - player.x);
        const streams = Math.min(4, 1 + Math.floor((player.lvl - 1) / 2));
        for (let s = 0; s < streams; s++) {
          const spread = (s - (streams - 1) / 2) * 0.14;
          bullets.push({ x: player.x, y: player.y, vx: Math.cos(ang + spread) * 8.5, vy: Math.sin(ang + spread) * 8.5, life: 75 });
        }
        player.fireCd = Math.max(7, 20 - player.lvl * 2);
      }

      bullets.forEach((b) => { b.x += b.vx; b.y += b.vy; b.life--; });
      bullets = bullets.filter((b) => b.life > 0);

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(ang) * e.speed;
        e.y += Math.sin(ang) * e.speed;

        if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) {
          player.hp = Math.max(0, player.hp - 0.45);
          if (player.hp <= 0) {
            player.hp = 100; score = 0; wave = 1; player.lvl = 1; enemies = []; gems = [];
          }
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 5) {
            e.hp--;
            bullets.splice(j, 1);
            if (e.hp <= 0) {
              burst(e.x, e.y, "#a855f7");
              gems.push({ x: e.x, y: e.y });
              score += 10 * wave;
              enemies.splice(i, 1);
              break;
            }
          }
        }
      }

      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const d = Math.hypot(player.x - g.x, player.y - g.y);
        if (d < 130) {
          g.x += ((player.x - g.x) / d) * 6.5;
          g.y += ((player.y - g.y) / d) * 6.5;
        }
        if (d < player.r + 8) {
          gems.splice(i, 1);
          player.xp += 1;
          if (player.xp >= player.lvl * 6) {
            player.xp = 0;
            player.lvl++;
            burst(player.x, player.y, "#38bdf8");
          }
        }
      }

      particles.forEach((p) => { p.x += p.vx; p.y += p.vy; p.life--; });
      particles = particles.filter((p) => p.life > 0);

      scoreBox.textContent = `WAVE ${wave} · SCORE ${score} · LVL ${player.lvl}`;
      hpBox.textContent = `HP: ${Math.ceil(player.hp)} / ${player.maxHp}`;
    }

    function draw() {
      ctx.fillStyle = "rgba(6, 8, 18, 0.38)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle cyber grid
      ctx.strokeStyle = "rgba(56, 189, 248, 0.06)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // XP Gems
      ctx.fillStyle = "#34d399";
      for (const g of gems) {
        ctx.beginPath(); ctx.arc(g.x, g.y, 4.5, 0, Math.PI * 2); ctx.fill();
      }

      // Bullets
      ctx.fillStyle = "#38bdf8";
      for (const b of bullets) {
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
      }

      // Enemies
      ctx.strokeStyle = "#f43f5e";
      ctx.lineWidth = 2.5;
      for (const e of enemies) {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.stroke();
      }

      // Particles
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }

      // Player
      ctx.shadowBlur = 16;
      ctx.shadowColor = "#38bdf8";
      ctx.fillStyle = "#e0f2fe";
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>

<script src="./gamepub-paywall.js"></script>
</body>
</html>
