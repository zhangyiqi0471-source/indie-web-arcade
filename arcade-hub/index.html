<!DOCTYPE html>

<head>

    body {

    }
    .container { max-width: 1140px; margin: 0 auto; padding: 44px 20px 80px; }
    header { text-align: center; margin-bottom: 44px; }
    header h1 { font-size: 42px; margin: 0 0 10px; font-weight: 900; }
    header p { color: #94a3b8; font-size: 17px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 24px; }
    .game-card {
      background: #111827; border: 1px solid rgba(148,163,184,0.16);
      border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .game-card:hover { transform: translateY(-4px); border-color: rgba(139,92,246,0.55); }
    .cover { width: 100%; aspect-ratio: 630 / 500; object-fit: cover; display: block; background: #090d16; }
    .body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #a78bfa; margin-bottom: 8px; }
    .price { color: #34d399; font-size: 14px; }
    .body h2 { margin: 0 0 8px; font-size: 21px; }
    .body p { margin: 0 0 18px; color: #94a3b8; font-size: 14px; line-height: 1.5; flex: 1; }
    .actions { display: flex; gap: 10px; }
    .btn-play, .btn-buy {
      flex: 1; text-align: center; padding: 10px 12px; border-radius: 10px;
      text-decoration: none; font-weight: 700; font-size: 13px;
    }
    .btn-play { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    .btn-buy { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff; }
  </style>
</head>
